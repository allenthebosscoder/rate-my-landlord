# Every value below has a dev-friendly default after the ":" — override by
# setting the environment variable, nothing here needs to be edited by hand
# to deploy elsewhere.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ratemylandlord}

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only
# validates the entities match what Flyway created and never touches the
# schema itself — this is what makes restarts safe instead of wiping data.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=${LOG_SQL:true}
quarkus.flyway.migrate-at-start=true

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Origin
quarkus.http.cors.exposed-headers=Access-Control-Allow-Origin,Access-Control-Allow-Credentials
quarkus.http.cors.access-control-allow-credentials=false

# Comma-separated usernames that become admin on registration (or on their
# next login, if the account already existed). Leave empty for local dev —
# then the first account ever registered becomes admin instead, so there's
# always someone who can moderate without extra setup. Set this before a
# real deployment: an unset allowlist means anyone who registers first (a
# stranger, on a public site) becomes admin.
app.admin-usernames=${ADMIN_USERNAMES:}

# Password reset emails. Mocked by default (nothing is actually sent —
# quarkus.mailer.mock intercepts it, and the reset link is also logged) so
# the flow works locally with zero setup. Set MAIL_MOCK=false and provide
# real SMTP details to actually send mail.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
quarkus.mailer.mock=${MAIL_MOCK:true}
quarkus.mailer.from=${MAIL_FROM:noreply@ratemylandlord.local}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.start-tls=${MAIL_START_TLS:DISABLED}