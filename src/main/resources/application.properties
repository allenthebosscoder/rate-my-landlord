# Every value below has a dev-friendly default after the ":" — override by
# setting the environment variable, nothing here needs to be edited by hand
# to deploy elsewhere.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ratemylandlord}

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only
# validates the entities match what Flyway created and never touches the
# schema itself — this is what makes restarts safe instead of wiping data.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=${LOG_SQL:true}
quarkus.flyway.migrate-at-start=true

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Origin
quarkus.http.cors.exposed-headers=Access-Control-Allow-Origin,Access-Control-Allow-Credentials
quarkus.http.cors.access-control-allow-credentials=false